[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deferred-teleop"
version = "0.0.0"
description = "Delay-tolerant, VR-mediated shared autonomy for remote robots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "YannickPr" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.11,<3",
    "websockets>=15,<17",
]

[project.scripts]
dtt-link = "deferred_teleop.link:main"

[project.optional-dependencies]
dev = [
    "jsonschema[format]>=4.23",
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.urls]
Repository = "https://github.com/YannickPr/Deferred-Teleoperation"
Issues = "https://github.com/YannickPr/Deferred-Teleoperation/issues"

[tool.setuptools]
package-dir = { "" = "python/src" }

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
