name: Vertical feature slice
description: Propose a bounded, testable capability
title: "feat: "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this capability needed?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the observable result.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Invariants
      description: Authority, safety, time, frame and protocol rules that must remain true.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should this issue deliberately not solve?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable completion conditions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Visible evidence
      description: What VR, Unreal, simulation or physical result should be recorded?
