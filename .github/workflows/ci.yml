name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Verify generated schemas
        run: python -m deferred_teleop.schema --check
      - name: Verify generated SO-101 description
        run: python -m deferred_teleop.robot_model.so101 --check
      - name: Verify cross-language SO-101 FK fixtures
        run: python -m deferred_teleop.robot_model.kinematics_reference --check
      - name: Verify M1 golden session and release evidence
        run: python -m deferred_teleop.release_gate verify --scope ci --skip-pytest
      - name: Test
        run: pytest

  robot-ownership-windows:
    name: Robot ownership (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test local Robot ownership
        run: python -m pytest -q tests/test_robot_ownership.py --tb=short
