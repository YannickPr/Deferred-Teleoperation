name: M2 authoring review snapshot

on:
  push:
    branches: [feat/m2-local-goal-authoring]
    paths: [.github/workflows/authoring-review-bundle.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public sources only
        run: |
          mkdir -p /tmp/dtt-review
          git archive --format=zip HEAD -o /tmp/dtt-review/source.zip
          git rev-parse HEAD > /tmp/dtt-review/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dtt-authoring-review-source
          path: /tmp/dtt-review/
          retention-days: 1
